services:
  collector:
    build:
      dockerfile: ./distribution/varnishotelcollector/Dockerfile
      context: .
      args:
        VARNISH_VERSION: 9.0.3
    depends_on:
      - varnish
      - grafana
    volumes:
      - ./dev/collector:/etc/varnishotelcollector:ro
      - varnish-vsm:/var/lib/varnish
    network_mode: host

  nginx:
    image: nginx:latest
    volumes:
      - ./dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev/nginx/html:/usr/share/nginx/html:ro

  varnish:
    image: ghcr.io/otto-ec/shopentrance/varnish:latest
    depends_on:
      - nginx
      - grafana
    ports:
      - "8080:80"
    volumes:
      - ./dev/varnish:/etc/varnish
      - varnish-vsm:/var/lib/varnish
    environment:
      VARNISH_LISTEN_ADDRESS: 0.0.0.0:80
      VARNISH_SIZE: 256m
      VARNISH_ADMIN_LISTEN_ADDRESS: 0.0.0.0
      VARNISH_FEATURES: +esi_disable_xml_check,+esi_ignore_other_elements
    entrypoint:
      - varnishd
      - -F
      - -f
      - /etc/varnish/main.vcl
      - -s
      - malloc,256m
      - -a
      - 0.0.0.0:80

  grafana:
    build:
      dockerfile: ./dev/grafana/Dockerfile
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  varnish-vsm:
