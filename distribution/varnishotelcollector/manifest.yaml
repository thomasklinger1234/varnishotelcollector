dist:
  module: github.com/thomasklinger1234/varnishotelcollector/varnishotelcollector
  name: varnishotelcollector
  description: Varnish+OTEL=<3
  output_path: build
  cgo_enabled: true

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.156.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.156.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.156.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.156.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.156.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.156.0

receivers:
  - gomod: github.com/thomasklinger1234/varnishotelcollector/receiver/varnishcachestatreceiver v1.2.3
  - gomod: github.com/thomasklinger1234/varnishotelcollector/receiver/varnishcachelogreceiver v1.2.3

connectors: []

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.52.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.52.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.52.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.52.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.52.0

scrapers: []

replaces:
  - github.com/thomasklinger1234/varnishotelcollector/receiver/varnishcachestatreceiver => ../receiver/varnishcachestatreceiver
  - github.com/thomasklinger1234/varnishotelcollector/receiver/varnishcachelogreceiver => ../receiver/varnishcachelogreceiver
